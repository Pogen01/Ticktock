# Render Blueprint: one free web service running the TickTock demo.
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
services:
  - type: web
    name: ticktock
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/info
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
